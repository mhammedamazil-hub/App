name: build-android-apk

# Builds the TaskFlow Android APK and publishes it as a GitHub Release
# (rolling tag `latest`) so anyone can download and install it:
# https://github.com/mhammedamazil-hub/App/releases/latest

on:
  push:
    branches: ["main", "arena/01a008ff-app"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a008ff-app
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.35.7"
      - run: flutter create . --platforms=android --project-name taskflow --org com.taskflow
      - run: flutter pub get && flutter test && flutter build apk --release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk taskflow.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest taskflow.apk --title "TaskFlow — Android APK" --notes "Download taskflow.apk, open it on your Android phone and allow installs from unknown sources."
