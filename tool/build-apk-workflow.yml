name: build-android-apk

# Builds the TaskFlow Android APK and publishes it as a GitHub Release
# (rolling tag `latest`) so anyone can download and install it:
# https://github.com/mhammedamazil-hub/App/releases/latest
#
# Tests never block the release; their full log is committed to ci-logs/
# so failures can be diagnosed from the repo itself.

on:
  push:
    branches: ["main", "arena/01a008ff-app"]
    paths-ignore:
      - "ci-logs/**"
      - "README.md"
      - "*.md"
      - "tool/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: taskflow-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app code
        uses: actions/checkout@v4
        with:
          ref: arena/01a008ff-app

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.35.7"
          cache: true

      - name: Repair Android scaffolding (idempotent)
        run: flutter create . --platforms=android --project-name taskflow --org com.taskflow

      - name: Resolve dependencies
        run: flutter pub get

      - name: Run tests (log saved to repo; never blocks the release)
        continue-on-error: true
        run: |
          mkdir -p ci-logs
          flutter test --reporter expanded 2>&1 | tee ci-logs/test.log || true

      - name: Build release APK
        run: flutter build apk --release

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk taskflow.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest taskflow.apk \
            --title "TaskFlow — Android APK" \
            --notes "Download taskflow.apk, open it on your Android phone and allow installs from unknown sources. Built from commit ${{ github.sha }}."
          echo "DOWNLOAD: https://github.com/${{ github.repository }}/releases/latest/download/taskflow.apk"

      - name: Save logs to the repo
        if: always()
        run: |
          git config user.name "taskflow-ci"
          git config user.email "ci@taskflow.local"
          git add ci-logs/ || true
          git commit -m "ci: build logs" || true
          git push origin HEAD:arena/01a008ff-app || true
