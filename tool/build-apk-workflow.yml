name: build-android-apk

# Builds the TaskFlow Android APK and publishes it as a GitHub Release
# (rolling tag `latest`) so anyone can download and install it:
# https://github.com/mhammedamazil-hub/App/releases/latest
#
# Enable this workflow by copying this file to .github/workflows/ in the
# repository (GitHub requires workflow files to be added by a human account).

on:
  push:
    branches: ["main", "arena/01a008ff-app"]
    paths-ignore:
      - "ci-logs/**"
      - "README.md"
      - "*.md"
      - "tool/**"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: taskflow-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app code
        uses: actions/checkout@v4
        with:
          ref: arena/01a008ff-app

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.35.7"
          cache: true

      - name: Prepare Android toolchain
        run: |
          flutter create . --platforms=android --project-name taskflow --org com.taskflow
          yes | flutter doctor --android-licenses || true

      - name: Test and build APK
        run: |
          mkdir -p ci-logs
          set -o pipefail
          flutter pub get 2>&1 | tee ci-logs/latest-build.log
          flutter test 2>&1 | tee -a ci-logs/latest-build.log
          flutter build apk --release 2>&1 | tee -a ci-logs/latest-build.log

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk taskflow.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest taskflow.apk \
            --title "TaskFlow — Android APK" \
            --notes "Install: download taskflow.apk, open it on your Android phone and allow installs from unknown sources. Built from commit ${{ github.sha }}."
          echo "Download page: https://github.com/${{ github.repository }}/releases/latest"
          echo "Direct APK:    https://github.com/${{ github.repository }}/releases/latest/download/taskflow.apk"

      - name: Attach build log on failure
        if: failure()
        run: |
          git config user.name "taskflow-ci"
          git config user.email "ci@taskflow.local"
          git add ci-logs/latest-build.log
          git commit -m "ci: build log" || true
          git push origin HEAD:arena/01a008ff-app
